<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Tesplayer</title>
<link rel="icon" href="/favicon.svg">
<style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, system-ui, sans-serif; }
    video { max-width: 100vw; max-height: 100vh; display: block; }
    #sound { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.35); color: #fff; font-size: 2rem; cursor: pointer; user-select: none; }
    #sound span { padding: 0.6em 1.2em; border: 2px solid #fff; border-radius: 999px; }
    #sound.hidden { display: none; }
</style>
</head>
<body>
<video id="video" src="/video.mp4" autoplay muted loop playsinline></video>
<div id="sound"><span>▶ Tap for sound</span></div>
<script>
    const video = document.getElementById('video');
    const sound = document.getElementById('sound');
    video.play().catch(() => {});
    sound.addEventListener('click', () => {
        video.muted = false;
        video.currentTime = 0;
        video.play().catch(() => {});
        sound.classList.add('hidden');
    });
</script>
</body>
</html>
