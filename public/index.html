<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Tesplayer</title>
<link rel="icon" href="/favicon.svg">
<style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, system-ui, sans-serif; }
    canvas, video { display: block; max-width: 100vw; max-height: 100vh; }
    [hidden] { display: none !important; }
    #hint { position: fixed; left: 0; right: 0; bottom: 4vh; text-align: center; color: rgba(255, 255, 255, 0.7);
        font-size: 1.1rem; letter-spacing: 0.02em; pointer-events: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<video id="video" src="/video.mp4" autoplay loop playsinline hidden></video>
<div id="hint" hidden>tap anywhere for sound</div>
<script src="/player.js"></script>
</body>
</html>
